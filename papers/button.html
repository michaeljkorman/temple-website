<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Temple Papers</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .checkout-btn {
            background-color: #00bf63;
            color: white;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }
        .checkout-btn:active {
            transform: scale(0.98);
        }
    </style>
    <!-- The correct Payhip modal script -->
    <script type="text/javascript" src="https://payhip.com/payhip.js"></script>
</head>
<body>

    <!-- The payhip-buy-button class tells the script to intercept this click and launch the modal -->
     
<a href="https://payhip.com/b/23rYU" class="payhip-buy-button checkout-btn" data-theme="none">Proceed to Secure Checkout</a>
</body>
</html>
