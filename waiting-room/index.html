<body>
    <h1>Have a seat.</h1>
    <p>You’re not ready to offer.</p>
    <p>But you’re still here.</p>

    <button id="sound-toggle" class="sealed">🔇 Awaken</button>
    <audio id="audio" loop>
        <source src="https://michaelkorman.com/waiting-room/temple_sound.mp3" type="audio/mpeg" />
    </audio>

    <script>
        let currentFade = null;

        function fadeAudio(audio, targetVolume, duration = 2000) {
            let step = 0.02;
            let interval = duration / (1 / step);

            if (currentFade) {
                clearInterval(currentFade);
            }

            if (targetVolume > audio.volume || audio.paused) {
                audio.volume = 0;
                audio.play();
            }

            currentFade = setInterval(() => {
                let diff = targetVolume - audio.volume;
                if (Math.abs(diff) < step) {
                    audio.volume = targetVolume;

                    if (targetVolume === 0) {
                        audio.pause();
                    }

                    clearInterval(currentFade);
                    currentFade = null;
                } else {
                    audio.volume += step * Math.sign(diff);
                    //		console.log(audio.volume);
                }
            }, interval);
        }

        const btn = document.getElementById('sound-toggle');
        const audio = document.getElementById('audio');
        btn.addEventListener('click', () => {
            btn.classList.toggle('sealed');
            btn.classList.toggle('unsealed');

            if (btn.classList.contains('unsealed')) {
                btn.textContent = '🔊 Sleep';
                fadeAudio(audio, 1);
            } else {
                btn.textContent = '🔇 Awaken';
                fadeAudio(audio, 0);
            }
        });
    </script>
