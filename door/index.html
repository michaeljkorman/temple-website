    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = {
                root: null,
                // Triggers as soon as the top of the element crosses 15% up from the bottom of the screen
                rootMargin: '0px 0px -15% 0px',
                threshold: 0 // Fires immediately upon touching that line, regardless of element height
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        console.log("adding visible " + entry.target.id);
                        // Un-observe if you only want the animation to play once:
                        //observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.frame').forEach(block => {
                observer.observe(block);
            });
        });
    </script>
