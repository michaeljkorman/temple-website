<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>the book</title>

    <link rel="icon" href="/images/favicon-flame.png" type="image/png">

    <script defer type="text/javascript" src="/js/klaro-config.js"></script>

    <script defer type="text/javascript" src="https://cdn.kiprotect.com/klaro/v0.7.22/klaro.js"></script>
    <link rel="stylesheet" href="https://cdn.kiprotect.com/klaro/v0.7.22/klaro.min.css">

    <link rel="stylesheet" href="/door/style.css">
</head>

<body>

    <main class="terminal-container">

        <h1 class="the-book-title">Get the Book</h1>

        <!-- Frame 12: File Manager" -->
        <section class="frame">
            <div class="sr-only">
                <p>A file manager showing three files:
                <ol>
                    <li>the-temple-papers.epub (425 KiB) - Electronic book document</li>
                    <li>the-temple-papers.m4b (221.5 MiB) - MPEG4 audio book</li>
                    <li>the-temple-papers.pdf (1.9 MiB) - PDF document</li>
                </ol>
                </p>
            </div>
            <img src="/door/assets/file-manager.webp" alt="Screenshot of 3 files" class="relic-img">
        </section>

        <!-- Frame 12: Purchase Mechanism -->
        <section class="frame frame-action">
            <a href="misery/" id="get-digital-bundle-btn" class="terminal-buy-link" aria-label="Digital Bundle — $19">
                <img src="/door/assets/button-digital.webp" alt="" role="presentation" class="relic-img buy-btn-img">
            </a>
        </section>

        <!-- Frame 5: Typst template -->
        <!-- <section class="frame spill">
            <div class="sr-only">
                <p>Fragment of computer code. It appears to be calculating the page number to be printed in the running header of a book.</p>
            </div>
            <img src="assets/typst-template.webp" alt="Fragment of computer code" class="relic-img">
        </section> -->

        <section class="frame">
            <p>(Paperback edition available on Amazon.)</p>
        </section>

        <footer class="terminal-footer">
            <p>
                <a href="https://shop.michaelkorman.com/contact">Contact</a> |
                <a href="https://shop.michaelkorman.com/privacy">Privacy Policy</a>
            </p>
        </footer>
    </main>

    <script>
        const btn = document.getElementById('get-digital-bundle-btn');

        btn.addEventListener('click', () => {
            try {
                posthog.capture('digital_bundle_clicked',
                    { destination: 'payhip' },
                    { transport: 'sendBeacon', send_instantly: true }
                );
            } catch (e) {
                // PostHog blocked or not loaded — carry on  
            }
        });  
    </script>
</body>

</html>
